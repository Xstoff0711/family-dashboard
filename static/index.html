<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Familie</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#23262b;--mut:#6b7280;--acc:#2f7d6d;--acc-ink:#fff;--line:#e8e3da;--warn:#b45309;--chip:#eef3f1;--danger:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--ink:#e8eaed;--mut:#9aa3ad;--acc:#4fb39f;--acc-ink:#0b1512;--line:#2a2f35;--warn:#fb923c;--chip:#232a2d;--danger:#f87171}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto}
header h1{font-size:20px;margin:0;flex:1}
#sync{font-size:12px;color:var(--mut)}
main{max-width:680px;margin:0 auto;padding:4px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in{display:flex;width:100%;max-width:680px}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--acc);font-weight:600}
h2{font-size:15px;margin:20px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.row+.row{border-top:1px solid var(--line)}
.ic{font-size:20px;width:26px;text-align:center}
.grow{flex:1;min-width:0}
.muted{color:var(--mut);font-size:14px}
.small{font-size:13px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--mut);margin:2px 4px 0 0;border:1px solid var(--line)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font:inherit;font-size:14px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.btn{font:inherit;font-size:15px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.btn.del{color:var(--danger)}
button.icon{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 6px}
.bar{display:flex;gap:8px;align-items:center;margin:6px 0 4px;flex-wrap:wrap}
.bar .sp{flex:1}
input[type=text],input[type=date],input[type=email],input[type=password],input[type=number],select,textarea{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0}
textarea{resize:vertical}
label.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none}
.entry{display:flex;align-items:center;gap:4px;padding:2px 0}
.entry .nm{flex:1}
.done{text-decoration:line-through;color:var(--mut)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.overlay,.sheet{overscroll-behavior:contain}
html.lock,html.lock body{overflow:hidden}
body.lock{position:fixed;left:0;right:0;width:100%}
.sech{display:flex;align-items:center;gap:8px;margin:22px 0 2px}
.sech h2{margin:0;font-size:18px;color:var(--ink);text-transform:none;letter-spacing:0}
.sech .sp{flex:1}
.sech+.muted{margin:0 0 6px}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;font:inherit;font-size:14px;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pick{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
.pick.dim{opacity:.6}
.daytitle{display:flex;align-items:baseline;gap:8px}
.daytitle b{font-size:17px}
.today{border-color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.link{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
ol.steps{padding-left:22px;margin:6px 0}
ol.steps li{margin:8px 0}
ul.ings{padding-left:20px;margin:6px 0}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-size:24px}
.lnk{display:inline-block;margin-top:4px;font-size:14px;color:var(--acc);text-decoration:none;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.rep{font-size:13px;opacity:.7}
.trow{display:flex;gap:10px;align-items:center;cursor:pointer}
.dayh{display:flex;align-items:center;justify-content:space-between}
.dayh.today h2{color:var(--acc)}
.nothing{margin:-4px 0 6px 2px}
.legend{margin:2px 0 8px}
.pbar{height:6px;border-radius:6px;background:var(--line);margin-top:4px;overflow:hidden}
.pbar div{height:6px;background:var(--acc)}
.warnh{color:var(--warn)}
.wrapup{margin-top:10px}
.actl{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.actl .bar input[type=date]{flex:1}
.scrollbox.tpl{height:55vh;height:55dvh}
.scrollbox{height:85vh;height:85dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;padding:0 10px 10px;margin:8px 0 14px}
.scrollbox h2:first-child{margin-top:12px}
.chips select{font:inherit;font-size:14px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.chips.nowrap{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chips.nowrap button{flex:none}
.hero{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0}
#auth{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;overscroll-behavior:contain;padding:calc(24px + env(safe-area-inset-top)) 16px 32px}
#auth .box{max-width:420px;margin:0 auto}
#auth h1{font-size:26px;margin:24px 0 6px}
#auth .aerr,.perr{background:color-mix(in srgb,var(--danger) 12%,var(--card));color:var(--danger);border:1px solid var(--danger);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
#auth .aerr:empty,.perr:empty{display:none}
#auth button.btn.pri{width:100%;margin-top:8px}
#auth code,.sheet code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:13px}
label.fl,div.fl{display:block;font-size:13px;color:var(--mut);margin-top:10px}
#me{border:0;width:34px;height:34px;border-radius:50%;color:#fff;font:600 15px/34px system-ui,sans-serif;cursor:pointer;padding:0;flex:none}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw button.on{border-color:var(--ink)}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0}
.mem+.mem{border-top:1px solid var(--line)}
.mem .av{width:28px;height:28px;border-radius:50%;color:#fff;font:600 13px/28px system-ui,sans-serif;text-align:center;flex:none}
</style>
</head>

<header><h1>🏡 <span id="fam">Familie</span> <small style="font-size:11px;font-weight:400;color:var(--mut)">v16</small></h1><span id="sync"></span><button id="me" data-a="tab" data-t="profile" aria-label="Profil" hidden></button></header>
<main id="view"></main>
<nav><div class="in" id="nav"></div></nav>

<script>

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);

const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };

function hash(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; }

/* ---------- Zutaten ---------- */
const ING_RE = /^(\d+(?:[.,]\d+)?(?:\/\d+)?)?\s*(?:(kg|ml|g|l|EL|TL|Stück|Scheiben|Scheibe|Dosen|Dose|Bund|Zehen|Zehe|Pck\.|Pck|Packung)\s+)?(.+)$/i;
function parseIng(line){
  const m = line.trim().match(ING_RE);
  if (!m) return {q:null, u:'', n:line.trim()};
  let q = null;
  if (m[1]) { q = m[1].includes('/') ? m[1].split('/').reduce((a,b)=>a/b) : parseFloat(m[1].replace(',','.')); }

  if (q != null && u.toLowerCase()==='kg') { q *= 1000; u = 'g'; }

  return {q, u, n:m[3].trim()};

async function authSubmit(form){
  const a = AUTH, v = n => form.elements[n] ? form.elements[n].value : '';
  if (a.mode !== 'login' && v('password') !== v('password2')) return setErr('aerr', 'Die Passwörter stimmen nicht überein.');
  let url, body;
  if (a.mode === 'login') { url = 'api/auth/login'; body = {email:v('email'), password:v('password')}; }
  else if (a.mode === 'register') { url = 'api/auth/register'; body = {token:a.invite, email:v('email'), name:v('name'), password:v('password'), family_name:v('family_name')}; }
  else { url = 'api/auth/setup'; body = {code:v('code'), family_name:v('family_name'), email:v('email'), name:v('name'), password:v('password')}; }
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; setErr('aerr', '');
  const r = await api('POST', url, body);
  btn.disabled = false;
  if (!r.ok) return setErr('aerr', r.j.message || 'Das hat nicht geklappt.');
  ME = r.j;

const KEYS = Object.keys(DEFAULTS);
const ALL_KEYS = [...KEYS, 'meta'];
let S = {};
let readOnly = false;
const ui = {cweek:iso(monday(new Date())), evCat:'', evRange:'month', cityOpen:false, evQ:'', rf:{q:'', ing:'', all:false, flags:[]}, outCat:'', outWe:false, tab:'today', week:iso(monday(new Date())), season:null, where:'all', modal:null, skip:0};
const timers = {};

function setSync(t){ $('#sync').textContent = t; }
function save(k){
  if (readOnly) return;
  clearTimeout(timers[k]);
  timers[k] = setTimeout(async () => {
    try {
      const r = await fetch('api/' + k, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(S[k])});
      if (!r.ok) throw new Error(r.status);
      setSync('✓ gespeichert');
    } catch (e) { setSync('⚠️ Speichern fehlgeschlagen'); }
  }, 250);
}
async function load(){
  try {
    const r = await fetch('api/state');
    if (r.status === 401) return;
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const fresh = d.recipes == null;
    for (const k of KEYS) {
      if (d[k] == null) { S[k] = DEFAULTS[k](); save(k); } else S[k] = d[k];
    }
    let mig = false;
    for (const r of S.recipes) {
      if (!Array.isArray(r.steps)) { r.steps = STEPS[r.name] || []; mig = true; }
      if (!r.meal) { r.meal = MEALS[r.name] || (BASE_NAMES.includes(r.name) ? 'main' : 'any'); mig = true; }
      if (r.tm == null) { r.tm = r.name.includes('(Thermomix)'); mig = true; }
    }
    let actMig = false;
    for (const a of S.activities) if (a.url == null) { a.url = TITLE_URLS[a.title] || ''; actMig = true; }
    if (actMig) save('activities');
    S.meta = d.meta || {seeded: fresh ? DEFAULTS.recipes().map(r => r.name) : BASE_NAMES.slice()};
    let metaChanged = !d.meta;
    const haveNames = new Set(S.recipes.map(r => r.name));
    for (const r of DEFAULTS.recipes()) if (!S.meta.seeded.includes(r.name)) {
      if (!haveNames.has(r.name)) { S.recipes.push(r); mig = true; }
      S.meta.seeded.push(r.name); metaChanged = true;
    }
    if (mig) save('recipes');
    if (metaChanged) save('meta');
    readOnly = false; setSync('');
  } catch (e) {
    if (!S.recipes) { readOnly = true; for (const k of KEYS) S[k] = DEFAULTS[k](); }
    S.meta ??= {seeded: []};
    setSync('⚠️ offline');
  }
  render();
  loadEvents();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !ui.modal && ME) load(); });

/* Grundtermin ohne Überspringen/Verschieben */
function baseDue(c, d){
  switch (c.repeat) {
    case 'daily': return true;
    case 'weekly': return c.day === wdOf(d);
    case 'biweekly': {
      if (c.day !== wdOf(d)) return false;
      const a = monday(c.date ? parseISO(c.date) : new Date(2026, 0, 5));
      return Math.round((monday(d) - a) / (7 * 864e5)) % 2 === 0;
    }
    case 'monthly': {
      if (!c.date) return false;
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return d.getDate() === Math.min(parseISO(c.date).getDate(), last);
    }
    case 'once': return c.date === iso(d);
  }
  return false;
}
function dueOn(c, d){
  const k = iso(d), sk = c.skip || {}, mv = c.moved || {};
  if (baseDue(c, d) && !sk[k] && !mv[k]) return true;
  return Object.entries(mv).some(([f, t]) => t === k && !sk[f]);
}
const origKey = (c, d) => Object.keys(c.moved || {}).find(f => c.moved[f] === iso(d)) || iso(d);
const isDone = (c, d) => !!(c.done && c.done[iso(d)]);

function overdueList(){
  const out = [], t = new Date();
  for (let i = 14; i >= 1; i--) {

  return out;
}

function daySuggestions(date, skip = 0){
  const k = iso(date), out = [];
  const evs = eventsOn(k).sort((a, b) => (b.from === k) - (a.from === k));
  for (const e of evs) {
    if (out.length >= 3) break;
    out.push({kind:'event', title:e.title, place:e.place, time:e.time, cost:e.cost, note:e.note, url:e.url,
              range: e.from !== e.to ? `bis ${fmtDate(parseISO(e.to))}` : '', nolink: !e.url && !EV.demo});
  }
  const pool = S.activities.filter(a => a.seasons.includes(seasonOf(date)));
  const start = pool.length ? (hash(k) + skip) % pool.length : 0;
  for (let i = 0; out.length < 3 && i < pool.length; i++) {
    const a = pool[(start + i) % pool.length];
    out.push({kind:'idea', title:a.title, place:a.place, cost:a.cost, note:a.note, url:a.url, verify:a.verify});
  }
  return out;
}

/* Wochenvorschlag: wählt Rezepte mit überlappenden Zutaten, damit die Einkaufsliste kurz bleibt */
const STAPLE = ['butter','öl','eier','milch','sahne','zwiebel','knoblauch','mehl','honig','zimt','sojasauce'];
const ingNames = r => r.ing.map(l => parseIng(l).n.toLowerCase()).filter(n => !STAPLE.some(s => n.includes(s)));
function genWeek(o){
  const wk = ui.week, have = new Map(), count = {}, last = {};
  let n = 0;
  const use = (r, d) => { for (const nm of ingNames(r)) have.set(nm, (have.get(nm) || 0) + 1); count[r.id] = (count[r.id] || 0) + 1; last[r.id] = d; };
  for (let d = 0; d < 7; d++) for (const [k] of SLOTS) for (const e of planSlot(wk, d, k)) { const r = e.r && recipeById(e.r); if (r) use(r, d); }
  const pool = slot => S.recipes.filter(r => slot === 'breakfast' ? (r.meal === 'breakfast' || r.meal === 'any') : (r.meal === 'main' || r.meal === 'any'));
  const pick = (slot, d, ok, kidOK) => {
    let best = null, bs = -1e9;
    for (const r of pool(slot).filter(ok)) {
      const names = ingNames(r), ov = names.filter(x => have.has(x)).length, nw = names.length - ov;
      let sc = ov * 1.6 - nw * 0.5 + (kidOK ? (r.kid ? 1 : -1.5) : 0) + Math.random() * 1.5;
      sc -= (count[r.id] || 0) * 8;
      if (last[r.id] != null && Math.abs(d - last[r.id]) <= 2) sc -= 6;
      if (sc > bs) { bs = sc; best = r; }
    }
    return best;
  };
  const put = (d, slot, r, who) => { planSlot(wk, d, slot, true).push({r:r.id, who}); use(r, d); n++; };
  const dual = new Set();
  if (o.keto && o.dn) {
    const days = [0,1,2,3,4,5,6].sort(() => Math.random() - 0.5);
    for (const d of days) { if (dual.size >= o.dual) break; if (![...dual].some(x => Math.abs(x - d) <= 1)) dual.add(d); }
  }
  for (let d = 0; d < 7; d++) {
    const slots = [];
    if (o.bf) slots.push('breakfast');
    if (d >= 5 ? o.lw : o.lwd) slots.push('lunch');
    if (o.dn) slots.push('dinner');
    for (const slot of slots) {
      if (planSlot(wk, d, slot).length) continue;
      if (!o.keto) { const r = pick(slot, d, () => true, true); if (r) put(d, slot, r, 'all'); continue; }
      const split = slot === 'breakfast' ? Math.random() < 0.6 : (slot === 'dinner' && dual.has(d));
      if (split) {
        const a = pick(slot, d, r => !r.keto, true);
        if (a) { put(d, slot, a, 'kids'); const b = pick(slot, d, r => r.keto, false); if (b) put(d, slot, b, 'partner'); continue; }
      }
      const r = pick(slot, d, r => r.keto, true);
      if (r) put(d, slot, r, 'all');
    }
  }
  return {n, items: shopItems().length};
}

const RF = [['keto','🥑 Keto'],['kid','👶 Kindgerecht'],['tm','🌀 Thermomix'],['bf','🍳 Frühstück'],['main','🍝 Hauptgericht'],['nosteps','Ohne Zubereitung']];
const terms = v => String(v || '').toLowerCase().split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
function filteredRecipes(){

  return S.recipes.filter(r => {
    if (qs && !r.name.toLowerCase().includes(qs)) return false;
    if (ings.length) {
      const has = t => r.ing.some(l => l.toLowerCase().includes(t));
      if (!(f.all ? ings.every(has) : ings.some(has))) return false;
    }
    for (const k of f.flags) {
      if (k === 'keto' && !r.keto) return false;
      if (k === 'kid' && !r.kid) return false;
      if (k === 'tm' && !r.tm) return false;
      if (k === 'bf' && !(r.meal === 'breakfast' || r.meal === 'any')) return false;
      if (k === 'main' && !(r.meal === 'main' || r.meal === 'any')) return false;
      if (k === 'nosteps' && (r.steps || []).length) return false;
    }
    return true;
  }).sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
function recipeRows(){

function shopItems(){
  const map = new Map();
  for (let d = 0; d < 7; d++) for (const [k] of SLOTS) for (const e of planSlot(ui.week, d, k)) {
    const r = e.r ? recipeById(e.r) : null;
    if (!r) continue;
    for (const line of r.ing) {
      const p = parseIng(line), key = p.n.toLowerCase() + '|' + p.u.toLowerCase();
      const cur = map.get(key) || {key, n:p.n, u:p.u, q:null};
      if (p.q != null) cur.q = (cur.q || 0) + p.q;
      map.set(key, cur);
    }
  }
  return [...map.values()];
}

function outCard(e, saved){

}
function viewOut(){
  const pins = (S.meta.dates ||= []);
  const pool = (EV.items || []).filter(e => e.cat === 'adult' && notPast(e));
  const all = pool.filter(e => inSel(e) && inRange(e));
  const wkend = e => { const w = wdOf(parseISO(e.from)); return w >= 4; };
  let list = all.filter(e => (!ui.outCat || (e.tags || []).some(t => t.startsWith(ui.outCat))) && (!ui.outWe || wkend(e)));
  const saved = all.filter(e => pins.includes(dateKey(e)));
  const chips = ['', ...OUT_CATS].map(c => `<button class="${ui.outCat === c ? 'on' : ''}" data-a="outCat" data-c="${c}">${c || 'Alle'}</button>`).join('');
  let st;
  if (EV.status === 'running') st = '🔎 Aktualisiere …';
  else if (EV.updated) st = `Stand ${fmtStamp(EV.updated)}`;
  else st = 'Noch keine Events abgefragt.';
  const days = [], tdy = iso(new Date());
  const runningOut = list.filter(e => e.from < tdy);
  for (const e of list.filter(e => e.from >= tdy)) { const l = days[days.length - 1]; if (l && l.d === e.from) l.items.push(e); else days.push({d:e.from, items:[e]}); }
  const body = (runningOut.length ? `<h2>Läuft gerade <span class="muted small">(${runningOut.length})</span></h2><div class="card">${runningOut.map(e => outCard(e, pins.includes(dateKey(e)))).join('')}</div>` : '') + days.map(g => { const d = parseISO(g.d); return `<h2>${DAYS[wdOf(d)]}, ${fmtDate(d)}</h2><div class="card">${g.items.map(e => outCard(e, pins.includes(dateKey(e)))).join('')}</div>`; }).join('');

function taskRow(c, d){
  const k = iso(d), on = isDone(c, d);
  const rep = c.repeat !== 'once' ? ' <span class="rep" title="' + RHYTHM[c.repeat] + '">🔁</span>' : '';
  const shop = c.link === 'shop' ? `<button class="icon" data-a="openShop" aria-label="Einkaufsliste">🛒</button>` : '';
  return `<div class="row chk"><label class="grow trow"><input type="checkbox" data-a="chkTask" data-id="${c.id}" data-d="${k}" ${on?'checked':''}><span class="${on?'done':''}">${whoDots(c.who)}${esc(c.title)}${rep}</span></label>${shop}<button class="icon" data-a="taskMenu" data-id="${c.id}" data-d="${k}" aria-label="Aktionen">⋯</button></div>`;
}
function viewChores(){
  const today = new Date(), tk = iso(today), mon = parseISO(ui.cweek), isCur = ui.cweek === iso(monday(today));
  let total = 0, done = 0, days = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = iso(d), ts = S.chores.filter(c => dueOn(c, d));
    total += ts.length; done += ts.filter(c => isDone(c, d)).length;
    const head = `${k === tk ? 'Heute · ' : ''}${DAYS[i]}, ${fmtDate(d)}`;
    days += `<div class="dayh ${k === tk ? 'today' : ''}"><h2>${head}</h2><button class="icon" data-a="addChore" data-d="${k}" aria-label="Aufgabe hinzufügen">＋</button></div>` +
      (ts.length ? `<div class="card">${ts.map(c => taskRow(c, d)).join('')}</div>` : '<div class="muted small nothing">nichts geplant</div>');
  }
  const pct = total ? Math.round(done / total * 100) : 0;
  const od = isCur || ui.cweek > iso(monday(today)) ? overdueList() : [];
  const overdue = (isCur && od.length) ? `<h2 class="warnh">⚠️ Überfällig (${od.length})</h2><div class="card">${od.map(({c, d}) =>
      `<div class="row chk"><label class="grow trow"><input type="checkbox" data-a="chkTask" data-id="${c.id}" data-d="${iso(d)}"><span>${whoDots(c.who)}${esc(c.title)} <span class="muted small">· ${SHORT[wdOf(d)]} ${fmtDate(d)}</span></span></label><button class="icon" data-a="taskMenu" data-id="${c.id}" data-d="${iso(d)}" aria-label="Aktionen">⋯</button></div>`).join('')}
      <div class="bar"><button class="btn" data-a="odToday">Alles auf heute</button><button class="btn" data-a="odSkip">Alles überspringen</button></div></div>` : '';
  let wrap = '';
  if (isCur && wdOf(today) === 6) {
    const open = [];
    for (let i = 0; i < 7; i++) { const d = addDays(mon, i); for (const c of S.chores) if (c.repeat !== 'daily' && dueOn(c, d) && !isDone(c, d)) open.push({c, d}); }
    wrap = `<div class="card wrapup"><b>🏁 Wochenabschluss</b><div class="muted small">${done} von ${total} Aufgaben erledigt${open.length ? `, ${open.length} offen: ${open.map(o => esc(o.c.title)).join(', ')}` : ' – alles geschafft 🎉'}</div>${open.length ? `<div class="bar"><button class="btn pri" data-a="wrapMove">Offenes auf Montag schieben</button><button class="btn" data-a="wrapSkip">Offenes überspringen</button></div>` : ''}</div>`;
  }
  const skipped = [];
  for (let i = 0; i < 7; i++) { const d = addDays(mon, i), k = iso(d); for (const c of S.chores) if (c.skip && c.skip[k] && baseDue(c, d)) skipped.push({c, d, k}); }
  const skipHTML = skipped.length ? `<h2>Übersprungen (${skipped.length})</h2><div class="card">${skipped.map(({c, d, k}) => `<div class="row"><div class="grow muted">${esc(c.title)} <span class="small">· ${SHORT[wdOf(d)]} ${fmtDate(d)}</span></div><button class="btn" data-a="unskip" data-id="${c.id}" data-d="${k}">↩ wieder einblenden</button></div>`).join('')}</div>` : '';
  return `<div class="bar"><button class="btn" data-a="cwk" data-n="-1">‹</button><b class="sp" style="text-align:center">Haushalt · KW ${isoWeek(mon)} · ${fmtDate(mon)}–${fmtDate(addDays(mon, 6))}</b><button class="btn" data-a="cwk" data-n="1">›</button></div>
    <div class="bar"><div class="sp"><div class="muted small">${done} von ${total} erledigt</div><div class="pbar"><div style="width:${pct}%"></div></div></div>${isCur ? '' : '<button class="btn" data-a="cwk" data-n="0">Diese Woche</button>'}<button class="btn" data-a="tpl">📋 Vorlagen</button><button class="btn pri" data-a="addChore" data-d="${tk}">＋ Aufgabe</button></div>
    <div class="muted small legend"><span class="dot" style="background:${DOT.me}"></span> Ich <span class="dot" style="background:${DOT.partner}"></span> Partnerin · beide Punkte = Beide · 🔁 wiederkehrend</div>
    ${wrap}${overdue}${days}${skipHTML}`;
}

/* Hintergrund nicht mitscrollen, solange ein Dialog offen ist (auch iOS) */
let lockY = null;
function scrollLock(on){
  const b = document.body;
  if (on && lockY === null) {
    lockY = window.scrollY;
    document.documentElement.classList.add('lock');
    b.classList.add('lock'); b.style.top = -lockY + 'px';
  } else if (!on && lockY !== null) {
    const y = lockY; lockY = null;
    document.documentElement.classList.remove('lock');
    b.classList.remove('lock'); b.style.top = '';
    window.scrollTo(0, y);
  }
}
function focusIn(id){ const i = document.getElementById(id); if (i) i.focus({preventScroll:true}); }

function moveOcc(id, dk, to, quiet){
  const c = S.chores.find(x => x.id === id); if (!c || dk === to) return;
  if (c.repeat === 'once') { c.date = to; if (c.done) delete c.done[dk]; }
  else {
    const f = origKey(c, parseISO(dk));
    c.moved ??= {}; c.skip ??= {};
    if (f === to) delete c.moved[f]; else c.moved[f] = to;
    if (c.done) delete c.done[dk];
  }
  if (!quiet) { save('chores'); render(); }
}
function skipOcc(id, dk, quiet){
  const c = S.chores.find(x => x.id === id); if (!c) return;
  if (c.repeat === 'once') { S.chores = S.chores.filter(x => x.id !== id); }
  else {
    const f = origKey(c, parseISO(dk));
    c.moved ??= {}; c.skip ??= {};
    delete c.moved[f]; c.skip[f] = true;
  }
  if (!quiet) { save('chores'); render(); }
}

    const o = {bf:chkd('gb'), lw:chkd('gl1'), lwd:chkd('gl2'), dn:chkd('gd'), keto:chkd('gk'), dual:Number(val('gx'))};
    const res = genWeek(o); save('plan');
    ui.modal = {type:'msg', title: res.n ? '✨ Woche geplant' : 'Nichts zu planen', text: res.n ? `${res.n} Einträge gesetzt. Die Einkaufsliste hat jetzt ${res.items} Artikel. Zu viel? Entferne einen Eintrag mit ✕ oder wähle über ＋ selbst.` : 'Alle gewählten Plätze sind schon belegt.'};
    render();
  },
  delRecipe: () => { if (!confirm('Rezept löschen?')) return; const id = ui.modal.r.id, had = recipeById(id) && recipeById(id).photo; S.recipes = S.recipes.filter(r => r.id !== id); if (had && !readOnly) fetch('api/photo/' + id, {method:'DELETE'}).catch(() => {}); save('recipes'); close(); },
  chkItem: (ds, el) => { const k = ui.week + '|' + ds.k; if (el.checked) S.shopping.checked[k] = true; else delete S.shopping.checked[k]; save('shopping'); render(); },
  manualNew: () => { ui.modal = {type:'manual', more:false}; render(); focusIn('mi'); },
  addManual: () => {
    const i = document.getElementById('mi'), t = i ? i.value.trim() : '';
    if (!t) { if (i) i.focus(); return; }
    S.shopping.manual.push({id:uid(), text:t, done:false}); save('shopping');
    if (chkd('mmore')) { ui.modal.more = true; render(); focusIn('mi'); } else close();
  },
  chkManual: (ds, el) => { S.shopping.manual.find(m => m.id === ds.id).done = el.checked; save('shopping'); render(); },
  rmManual: ds => { S.shopping.manual = S.shopping.manual.filter(m => m.id !== ds.id); save('shopping'); render(); },
  clearManual: () => { S.shopping.manual = S.shopping.manual.filter(m => !m.done); save('shopping'); render(); },
  resetChecks: () => { for (const k of Object.keys(S.shopping.checked)) if (k.startsWith(ui.week + '|')) delete S.shopping.checked[k]; save('shopping'); render(); },
  season: ds => { ui.season = ds.v; render(); },
  where: ds => { ui.where = ds.v; render(); },
  fav: ds => { const a = S.activities.find(x => x.id === ds.id); a.fav = !a.fav; save('activities'); render(); },
  did: ds => { const a = S.activities.find(x => x.id === ds.id); a.last = fmtDate(new Date()) + new Date().getFullYear(); save('activities'); render(); },
  rand: () => { const l = filteredActs(); if (!l.length) return; ui.modal = {type:'rand', a:l[Math.floor(Math.random()*l.length)]}; render(); },
  editAct: ds => { const a = ds.id ? structuredClone(S.activities.find(x => x.id === ds.id)) : {id:'', title:'', place:'', note:'', where:'out', cost:'', seasons:[seasonOf(new Date())]}; ui.modal = {type:'act', a}; render(); },
  saveAct: () => {
    const a = ui.modal.a, title = val('at').trim(); if (!title) return;
    const seasons = [...document.querySelectorAll('.as:checked')].map(x => x.value);
    const au = val('au').trim();
    const data = {title, url:/^https?:\/\//i.test(au) ? au : '', place:val('ap').trim(), note:val('an').trim(), where:val('aw'), cost:val('ac'), seasons:seasons.length ? seasons : ALL};
    if (a.id) Object.assign(S.activities.find(x => x.id === a.id), data); else S.activities.push({id:uid(), verify:false, fav:false, last:null, ...data});
    save('activities'); close();
  },
  delAct: () => { if (!confirm('Idee löschen?')) return; S.activities = S.activities.filter(x => x.id !== ui.modal.a.id); save('activities'); close(); },
  chkTask: (ds, el) => { const c = S.chores.find(x => x.id === ds.id); c.done ??= {}; if (el.checked) c.done[ds.d] = true; else delete c.done[ds.d]; save('chores'); render(); },
  editChore: ds => { const c = ds.id ? structuredClone(S.chores.find(x => x.id === ds.id)) : {id:'', title:'', who:'both', repeat:'weekly', day:wdOf(new Date()), date:iso(new Date())}; ui.modal = {type:'chore', c}; render(); },
  addChore: ds => { const d = parseISO(ds.d); ui.modal = {type:'chore', c:{id:'', title:'', who:'both', repeat:'once', day:wdOf(d), date:ds.d}}; render(); },
  saveChore: () => {
    const c = ui.modal.c, title = val('ct').trim(); if (!title) return;
    const data = {title, who:val('cw'), repeat:val('cr'), day:Number(val('cd')), date:val('cdt'), link:chkd('cl') ? 'shop' : ''};
    if (data.repeat === 'once' && !data.date) data.date = iso(new Date());
    if (data.repeat === 'monthly' && !data.date) data.date = iso(new Date());
    if (data.repeat === 'biweekly' && !data.date) data.date = iso(new Date());
    if (c.id) Object.assign(S.chores.find(x => x.id === c.id), data); else S.chores.push({id:uid(), done:{}, skip:{}, moved:{}, ...data});
    save('chores'); close();
  },
  delChore: () => { if (!confirm('Ganze Serie löschen? Alle Termine dieser Aufgabe verschwinden.')) return; S.chores = S.chores.filter(x => x.id !== ui.modal.c.id); save('chores'); close(); },
  cwk: ds => { const n = Number(ds.n); ui.cweek = n === 0 ? iso(monday(new Date())) : iso(addDays(parseISO(ui.cweek), 7 * n)); render(); },
  openShop: () => { ui.tab = 'shop'; window.scrollTo(0, 0); render(); },
  taskMenu: ds => { ui.modal = {type:'task', id:ds.id, d:ds.d}; render(); },
  tkTomorrow: () => { const m = ui.modal; moveOcc(m.id, m.d, iso(addDays(parseISO(m.d), 1))); close(); },
  tkMove: () => { const m = ui.modal, to = val('tkdate'); if (!to) return; moveOcc(m.id, m.d, to); close(); },
  tkSkip: () => { skipOcc(ui.modal.id, ui.modal.d); close(); },
  tkDelOnce: () => { if (!confirm('Aufgabe löschen?')) return; S.chores = S.chores.filter(x => x.id !== ui.modal.id); save('chores'); close(); },
  tkDelSeries: () => { if (!confirm('Ganze Serie löschen? Alle Termine dieser Aufgabe verschwinden.')) return; S.chores = S.chores.filter(x => x.id !== ui.modal.id); save('chores'); close(); },
  tkEdit: () => { const c = structuredClone(S.chores.find(x => x.id === ui.modal.id)); ui.modal = {type:'chore', c}; render(); },
  unskip: ds => { const c = S.chores.find(x => x.id === ds.id); if (c && c.skip) delete c.skip[ds.d]; save('chores'); render(); },
  odToday: () => { const t = iso(new Date()); for (const {c, d} of overdueList()) moveOcc(c.id, iso(d), t, true); save('chores'); render(); },
  odSkip: () => { for (const {c, d} of overdueList()) skipOcc(c.id, iso(d), true); save('chores'); render(); },
  wrapMove: () => { const mon = parseISO(ui.cweek), next = iso(addDays(mon, 7)); for (let i = 0; i < 7; i++) { const d = addDays(mon, i); for (const c of S.chores.slice()) if (c.repeat !== 'daily' && dueOn(c, d) && !isDone(c, d)) moveOcc(c.id, iso(d), next, true); } save('chores'); render(); },
  wrapSkip: () => { const mon = parseISO(ui.cweek); for (let i = 0; i < 7; i++) { const d = addDays(mon, i); for (const c of S.chores.slice()) if (c.repeat !== 'daily' && dueOn(c, d) && !isDone(c, d)) skipOcc(c.id, iso(d), true); } save('chores'); render(); },
  tpl: () => { ui.modal = {type:'tpl'}; render(); },
  tplAdd: ds => {
    const t = TPL[Number(ds.i)]; if (S.chores.some(c => c.title === t.title)) return;
    S.chores.push({id:uid(), title:t.title, who:t.who, repeat:t.repeat, day:t.day ?? 0, date:(t.repeat === 'biweekly' || t.repeat === 'monthly') ? iso(new Date()) : '', link:t.link || '', done:{}, skip:{}, moved:{}});
    save('chores'); render();
  },
  tplClear: () => { if (!confirm('Wirklich ALLE Aufgaben entfernen?')) return; S.chores = []; save('chores'); render(); },
};
Object.assign(ACT, {
  retry: () => boot(),
  pickColor: ds => {
    document.getElementById('pcol').value = ds.c;
    document.querySelectorAll('.sw button').forEach(b => b.classList.toggle('on', b.dataset.c === ds.c));
  },
  invite: () => makeInvite(false),
  inviteFamily: () => makeInvite(true),
  copyInvite: async () => {
    const el = document.getElementById('invurl');
    try { await navigator.clipboard.writeText(el.value); } catch (e) { el.select(); document.execCommand('copy'); }
    setSync('✓ Link kopiert');
  },
  rmMember: async ds => {
    if (!confirm(`${ds.n} aus der Familie entfernen? Das Konto wird gelöscht und auf allen Geräten abgemeldet.`)) return;
    const r = await api('DELETE', 'api/family/members/' + ds.id);
    if (!r.ok) { ui.modal = {type:'msg', title:'Nicht möglich', text:r.j.message || 'Das hat nicht geklappt.'}; return render(); }
    const m = await api('GET', 'api/me'); if (m.ok) ME = m.j; render();
  },
  logout: async () => { await api('POST', 'api/auth/logout'); location.href = location.pathname; },
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'authform') return authSubmit(f);
  const h = f.dataset.form && FORMS[f.dataset.form];
  if (h) h(f);
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = ACT[el.dataset.a];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.in === 'evcat') { ui.evCat = e.target.value; render(); }
});
document.addEventListener('input', e => {
  const t = e.target.dataset && e.target.dataset.in;
  if (t === 'evq') { ui.evQ = e.target.value; const m = eventList().match(/<div id="evl"[^>]*>([\s\S]*)<\/div>$/); document.getElementById('evl').innerHTML = m ? m[1] : ''; return; }
  if (t === 'rfq' || t === 'rfi') { ui.rf[t === 'rfq' ? 'q' : 'ing'] = e.target.value; document.getElementById('rl').innerHTML = recipeRows(); return; }
  if (t === 'pickq') { ui.modal.q = e.target.value; document.getElementById('pl').innerHTML = pickList(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'manualEnter') ACT.addManual();
});

async function shrink(file, max = 1600, q = 0.85){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q).split(',')[1];
}
document.addEventListener('change', async e => {
  if (e.target.id === 'photof' && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = '';
    try { syncEditor(); ui.modal.photoData = await shrink(f, 1000, 0.82); ui.modal.photoRemove = false; render(); }
    catch (err) { ui.modal = {type:'msg', title:'Foto nicht lesbar', text:'Dieses Bild konnte nicht verarbeitet werden.'}; render(); }
  }
});

$('#view').innerHTML = '<div class="empty">Lade …</div>';
boot();
</script>
